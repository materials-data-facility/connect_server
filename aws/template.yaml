AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MDF Connect v2 Backend - Serverless data publishing service

# ============================================================================
# DEPLOYMENT GUIDE
# ============================================================================
#
# Prerequisites:
#   brew install aws-sam-cli  # or: pip install aws-sam-cli
#   aws configure             # set up AWS credentials
#
# Deploy to dev:
#   sam build && sam deploy --config-env dev
#
# Deploy to production:
#   sam build && sam deploy --config-env prod
#
# Local testing:
#   sam local start-api       # runs API on localhost:3000
#   python -m v2.local_server # alternative: pure Python server
#
# View logs:
#   sam logs -n SubmitFunction --stack-name mdf-connect-v2-dev --tail
#
# ============================================================================

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (optional, e.g., api.materialsdatafacility.org)

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        STORE_BACKEND: dynamodb
        DYNAMO_SUBMISSIONS_TABLE: !Ref SubmissionsTable
        DYNAMO_STREAMS_TABLE: !Ref StreamsTable
        LOG_LEVEL: !If [IsProd, INFO, DEBUG]
    Layers:
      - !Ref DependenciesLayer

Resources:
  # ===========================================================================
  # API Gateway
  # ===========================================================================

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Description: MDF Connect v2 API
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
      Auth:
        DefaultAuthorizer: GlobusAuthorizer
        Authorizers:
          GlobusAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization

  # ===========================================================================
  # Lambda Functions - Dataset Publishing
  # ===========================================================================

  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.submit.lambda_handler
      CodeUri: .
      Description: Submit new dataset
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /submit
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.status.lambda_handler
      CodeUri: .
      Description: Get dataset status
      Events:
        GetById:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /status/{source_id}
            Method: GET
        GetAll:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /status
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable

  SubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.submissions.lambda_handler
      CodeUri: .
      Description: List submissions
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /submissions
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable

  CardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.dataset_card.lambda_handler
      CodeUri: .
      Description: Get dataset preview card
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /card/{source_id}
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable

  CitationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.citation.lambda_handler
      CodeUri: .
      Description: Get dataset citation
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /citation/{source_id}
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.search.lambda_handler
      CodeUri: .
      Description: Search datasets and streams
      Timeout: 60
      MemorySize: 512
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /search
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StreamsTable

  # ===========================================================================
  # Lambda Functions - Streaming
  # ===========================================================================

  StreamCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_create.lambda_handler
      CodeUri: .
      Description: Create data stream
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/create
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable

  StreamAppendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_append.lambda_handler
      CodeUri: .
      Description: Append to data stream
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}/append
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable

  StreamUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_upload.lambda_handler
      CodeUri: .
      Description: Upload files to stream
      Timeout: 60
      MemorySize: 512
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}/upload
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket

  StreamFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_upload.list_files_handler
      CodeUri: .
      Description: List files in stream
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}/files
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StreamsTable
        - S3ReadPolicy:
            BucketName: !Ref FilesBucket

  StreamStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_status.lambda_handler
      CodeUri: .
      Description: Get stream status
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StreamsTable

  StreamCloseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_close.lambda_handler
      CodeUri: .
      Description: Close data stream
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}/close
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable

  StreamSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.stream_snapshot.lambda_handler
      CodeUri: .
      Description: Create stream snapshot (publish to dataset)
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /stream/{stream_id}/snapshot
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable

  # ===========================================================================
  # Authorizer
  # ===========================================================================

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.authorizer.lambda_handler
      CodeUri: .
      Description: Globus Auth token validation
      Environment:
        Variables:
          GLOBUS_CLIENT_ID: "{{resolve:ssm:/mdf/globus-client-id}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mdf/*"

  # ===========================================================================
  # DynamoDB Tables
  # ===========================================================================

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "mdf-submissions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: source_id
          AttributeType: S
        - AttributeName: version
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: organization
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: source_id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user-submissions
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: org-submissions
          KeySchema:
            - AttributeName: organization
              KeyType: HASH
            - AttributeName: source_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  StreamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "mdf-streams-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stream_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: stream_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-streams
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===========================================================================
  # S3 Bucket for Stream Files
  # ===========================================================================

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # ===========================================================================
  # Dependencies Layer
  # ===========================================================================

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "mdf-dependencies-${Environment}"
      Description: Python dependencies for MDF functions
      ContentUri: ./layers/dependencies/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

# ===========================================================================
# Outputs
# ===========================================================================

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  SubmissionsTableName:
    Description: DynamoDB table for submissions
    Value: !Ref SubmissionsTable

  StreamsTableName:
    Description: DynamoDB table for streams
    Value: !Ref StreamsTable

  FilesBucketName:
    Description: S3 bucket for stream files
    Value: !Ref FilesBucket
