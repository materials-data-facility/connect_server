AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MDF Connect v2 Backend - Single FastAPI Lambda via Mangum

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment
  AuthMode:
    Type: String
    Default: production
    AllowedValues: [dev, production]
    Description: "dev = X-User-Id headers (no Globus). production = Globus token introspection."
  GlobusClientId:
    Type: String
    Default: "not-configured"
    Description: "Globus OAuth client ID. Only needed when AuthMode=production."
  GlobusClientSecret:
    Type: String
    Default: "not-configured"
    NoEcho: true
    Description: "Globus OAuth client secret. Only needed when AuthMode=production."
  DataCiteUsername:
    Type: String
    Default: "not-configured"
    Description: "DataCite repository ID for DOI minting."
  DataCitePassword:
    Type: String
    Default: "not-configured"
    NoEcho: true
    Description: "DataCite repository password."
  DataCiteApiUrl:
    Type: String
    Default: "https://api.test.datacite.org"
    Description: "DataCite API endpoint."
  DataCitePrefix:
    Type: String
    Default: "10.23677"
    Description: "DOI prefix for DataCite minting."
  SearchIndexUUID:
    Type: String
    Default: "not-configured"
    Description: "Globus Search index UUID for v2 production."
  TestSearchIndexUUID:
    Type: String
    Default: "not-configured"
    Description: "Globus Search index UUID for v2 test/staging."
  HttpApiThrottleRate:
    Type: Number
    Default: 100
    Description: "API Gateway steady-state request rate per second."
  HttpApiThrottleBurst:
    Type: Number
    Default: 200
    Description: "API Gateway burst request limit."
  ApiTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 30
    Description: "API Lambda timeout in seconds (bounded to API Gateway integration timeout)."
  ApiMemorySizeMb:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: "API Lambda memory size in MB."
  AsyncWorkerTimeoutSeconds:
    Type: Number
    Default: 120
    MinValue: 3
    MaxValue: 900
    Description: "Async worker Lambda timeout in seconds."
  AsyncWorkerMemorySizeMb:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: "Async worker Lambda memory size in MB."
  ApiReservedConcurrency:
    Type: Number
    Default: 50
    MinValue: 1
    Description: "Reserved concurrency cap for API Lambda to control runaway spend. A single signed-in detail-page load bursts ~5 concurrent calls; 10 was low enough that one save + refetch could throttle real traffic."
  AsyncWorkerReservedConcurrency:
    Type: Number
    Default: 3
    MinValue: 1
    Description: "Reserved concurrency cap for async worker Lambda."
  AsyncWorkerBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10
    Description: "SQS batch size for async worker event source."
  AsyncWorkerBatchWindowSeconds:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 300
    Description: "SQS maximum batching window to reduce Lambda invoke count. 0 = invoke immediately; at MDF's event volume (O(1000) publishes/year) batching only adds user-visible publish latency."
  AsyncQueueMessageRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
    Description: "SQS async queue message retention in seconds."
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: "CloudWatch Logs retention period for Lambda log groups."
  StorageBackend:
    Type: String
    Default: "auto"
    AllowedValues: ["auto", "local", "s3", "globus"]
    Description: "File storage backend. 'auto' selects local for dev, globus for prod."
  UseMockDatacite:
    Type: String
    Default: "auto"
    AllowedValues: ["auto", "true", "false"]
    Description: "Mock DataCite for DOI minting. 'auto' = true for dev, false for prod."
  AllowAllCurators:
    Type: String
    Default: "auto"
    AllowedValues: ["auto", "true", "false"]
    Description: "Allow all users to curate. 'auto' = true for dev, false for prod."
  CuratorGroupIds:
    Type: String
    Default: "3ce2c53e-3752-11e8-891c-0e00fd09bf20"
    Description: "Comma-separated Globus group UUIDs whose members may curate."
  CuratorUserIds:
    Type: String
    Default: ""
    Description: "Comma-separated Globus user IDs (sub) granted curator access directly, independent of group membership. Break-glass list for named admins so a groups-token failure cannot lock out all curators."
  RequiredGroupMembership:
    Type: String
    Default: "cc192dca-3751-11e8-90c1-0a7c735d220a"
    Description: "Globus group UUID required to submit datasets."
  SesFromEmail:
    Type: String
    Default: ""
    Description: "SES-verified sender address for email notifications. Leave blank to disable emails."
  CuratorEmails:
    Type: String
    Default: ""
    Description: "Comma-separated curator email addresses for new-submission alerts."
  PortalUrl:
    Type: String
    Default: "https://www.materialsdatafacility.org"
    Description: "Public dataset portal base URL."
  CurationPortalUrl:
    Type: String
    Default: "https://www.materialsdatafacility.org/curation"
    Description: "Curation review page URL (curators are redirected here)."
  EnableEmails:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Set to 'true' to enable SES email notifications. Keep 'false' on staging until SES is configured in the production account."
  OpenAIApiKey:
    Type: String
    Default: "not-configured"
    NoEcho: true
    Description: "OpenAI API key. Used for dataset text embeddings (semantic search)."
  EmbeddingModel:
    Type: String
    Default: "text-embedding-3-small"
    Description: "OpenAI embedding model name."
  EmbeddingDims:
    Type: String
    Default: "1536"
    Description: "Embedding dimensions. text-embedding-3-small supports 512 / 1024 / 1536."
  EmbeddingSnapshotPublicUrl:
    Type: String
    Default: ""
    Description: "Optional public HTTPS base URL (CloudFront) for the embeddings snapshot bucket. Leave blank to skip public URLs."
  GitHubSyncToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "GitHub token with actions:write on GitHubSyncRepo, used by POST /admin/sync to dispatch the v1->v2 sync workflow. Leave blank to disable the trigger (endpoint returns 501)."
  GitHubSyncRepo:
    Type: String
    Default: ""
    Description: "owner/repo hosting the sync workflow, e.g. 'materials-data-facility/connect_server'. Leave blank to disable the POST /admin/sync trigger."
  ApiCustomDomainName:
    Type: String
    Default: ""
    Description: "Custom API hostname, e.g. api.materialsdatafacility.org (prod) or api-staging.materialsdatafacility.org (staging). Only used when ApiCustomDomainCertArn is also set."
  ApiCustomDomainCertArn:
    Type: String
    Default: ""
    Description: "ACM certificate ARN for ApiCustomDomainName. Must live in THIS stack's region (HTTP API custom domains are REGIONAL). Leave blank to skip the custom domain entirely; the execute-api URL always works."
  AlarmEmail:
    Type: String
    Default: ""
    Description: "Email address subscribed to the CloudWatch alarm SNS topic. Leave blank to skip alarms/SNS. The subscription must be confirmed from the address's inbox once."

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsDevEnvironment: !Equals [!Ref Environment, dev]
  IsDevAuth: !Equals [!Ref AuthMode, dev]
  IsDevMode: !Or [!Condition IsDevAuth, !Condition IsDevEnvironment]
  UseAutoStorage: !Equals [!Ref StorageBackend, "auto"]
  UseAutoMockDatacite: !Equals [!Ref UseMockDatacite, "auto"]
  UseAutoAllowCurators: !Equals [!Ref AllowAllCurators, "auto"]
  CreateStreamFilesBucket: !Not [!Equals [!Ref AuthMode, dev]]
  EmailsEnabled: !Equals [!Ref EnableEmails, "true"]
  HasCustomDomain: !Not [!Equals [!Ref ApiCustomDomainCertArn, ""]]
  HasAlarms: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  # ===========================================================================
  # Single Lambda Function (FastAPI + Mangum)
  # ===========================================================================

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.app.main.handler
      CodeUri: .
      Description: MDF Connect v2 API (FastAPI)
      Timeout: !Ref ApiTimeoutSeconds
      MemorySize: !Ref ApiMemorySizeMb
      ReservedConcurrentExecutions: !Ref ApiReservedConcurrency
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          STORE_BACKEND: dynamo
          ASYNC_DISPATCH_MODE: !If [IsDevAuth, "inline", "sqs"]
          ASYNC_QUEUE_URL: !Ref AsyncJobsQueue
          AUTH_MODE: !Ref AuthMode
          DYNAMO_SUBMISSIONS_TABLE: !Ref SubmissionsTable
          DYNAMO_STREAMS_TABLE: !Ref StreamsTable
          STORAGE_BACKEND: !If
            - UseAutoStorage
            - !If [IsDevAuth, "local", "globus"]
            - !Ref StorageBackend
          GLOBUS_BASE_PATH: !If [IsDevAuth, "/tmp/testing", !Sub "/tmp/${Environment}"]
          S3_BUCKET: !If [IsDevAuth, "", !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"]
          S3_PREFIX: "streams/"
          GLOBUS_CLIENT_ID: !Ref GlobusClientId
          GLOBUS_CLIENT_SECRET: !Ref GlobusClientSecret
          USE_MOCK_DATACITE: !If
            - UseAutoMockDatacite
            - !If [IsDevMode, "true", "false"]
            - !Ref UseMockDatacite
          DATACITE_USERNAME: !Ref DataCiteUsername
          DATACITE_PASSWORD: !Ref DataCitePassword
          DATACITE_API_URL: !Ref DataCiteApiUrl
          DATACITE_PREFIX: !Ref DataCitePrefix
          SEARCH_INDEX_UUID: !Ref SearchIndexUUID
          TEST_SEARCH_INDEX_UUID: !Ref TestSearchIndexUUID
          USE_MOCK_SEARCH: !If [IsDevMode, "true", "false"]
          ALLOW_ALL_CURATORS: !If
            - UseAutoAllowCurators
            - !If [IsDevAuth, "true", "false"]
            - !Ref AllowAllCurators
          CURATOR_GROUP_IDS: !If [IsDevAuth, "", !Ref CuratorGroupIds]
          CURATOR_USER_IDS: !If [IsDevAuth, "", !Ref CuratorUserIds]
          REQUIRED_GROUP_MEMBERSHIP: !If [IsDevAuth, "", !Ref RequiredGroupMembership]
          CORS_ALLOWED_ORIGINS: !If
            - IsProd
            - "https://materialsdatafacility.org,https://app.materialsdatafacility.org"
            - "*"
          LOG_LEVEL: !If [IsProd, INFO, DEBUG]
          SEARCH_MAX_RESULTS: "50"
          SEARCH_MAX_DATASET_SCAN: "1000"
          SEARCH_MAX_STREAM_SCAN: "2000"
          SES_FROM_EMAIL: !If [EmailsEnabled, !Ref SesFromEmail, ""]
          CURATOR_EMAILS: !If [EmailsEnabled, !Ref CuratorEmails, ""]
          PORTAL_URL: !Ref PortalUrl
          CURATION_PORTAL_URL: !Ref CurationPortalUrl
          SES_REGION: !Ref AWS::Region
          OPENAI_API_KEY: !Ref OpenAIApiKey
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMS: !Ref EmbeddingDims
          EMBEDDING_SNAPSHOT_BUCKET: !Sub "mdf-embeddings-${Environment}-${AWS::AccountId}"
          EMBEDDING_SNAPSHOT_PREFIX: "embeddings/v1/"
          EMBEDDING_SNAPSHOT_PUBLIC_URL: !Ref EmbeddingSnapshotPublicUrl
          GITHUB_SYNC_TOKEN: !Ref GitHubSyncToken
          GITHUB_SYNC_REPO: !Ref GitHubSyncRepo
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable
        - S3CrudPolicy:
            BucketName: !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"
        - S3CrudPolicy:
            BucketName: !Sub "mdf-embeddings-${Environment}-${AWS::AccountId}"
        - Statement:
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt AsyncJobsQueue.Arn
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: "*"
        # Read-only view of the v1->v2 sync state for /admin/stats and
        # /admin/sync. The GitHub Actions runner is the only writer.
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mdf/${Environment}/sync-*"

  AsyncWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: v2.async_worker.lambda_handler
      CodeUri: .
      Description: MDF Connect v2 async job worker
      Timeout: !Ref AsyncWorkerTimeoutSeconds
      MemorySize: !Ref AsyncWorkerMemorySizeMb
      ReservedConcurrentExecutions: !Ref AsyncWorkerReservedConcurrency
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          STORE_BACKEND: dynamo
          ASYNC_DISPATCH_MODE: inline
          AUTH_MODE: !Ref AuthMode
          DYNAMO_SUBMISSIONS_TABLE: !Ref SubmissionsTable
          DYNAMO_STREAMS_TABLE: !Ref StreamsTable
          STORAGE_BACKEND: !If
            - UseAutoStorage
            - !If [IsDevAuth, "local", "globus"]
            - !Ref StorageBackend
          GLOBUS_BASE_PATH: !If [IsDevAuth, "/tmp/testing", !Sub "/tmp/${Environment}"]
          S3_BUCKET: !If [IsDevAuth, "", !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"]
          S3_PREFIX: "streams/"
          GLOBUS_CLIENT_ID: !Ref GlobusClientId
          GLOBUS_CLIENT_SECRET: !Ref GlobusClientSecret
          USE_MOCK_DATACITE: !If
            - UseAutoMockDatacite
            - !If [IsDevMode, "true", "false"]
            - !Ref UseMockDatacite
          DATACITE_USERNAME: !Ref DataCiteUsername
          DATACITE_PASSWORD: !Ref DataCitePassword
          DATACITE_API_URL: !Ref DataCiteApiUrl
          DATACITE_PREFIX: !Ref DataCitePrefix
          SEARCH_INDEX_UUID: !Ref SearchIndexUUID
          TEST_SEARCH_INDEX_UUID: !Ref TestSearchIndexUUID
          USE_MOCK_SEARCH: !If [IsDevMode, "true", "false"]
          ALLOW_ALL_CURATORS: !If
            - UseAutoAllowCurators
            - !If [IsDevAuth, "true", "false"]
            - !Ref AllowAllCurators
          CURATOR_GROUP_IDS: !If [IsDevAuth, "", !Ref CuratorGroupIds]
          CURATOR_USER_IDS: !If [IsDevAuth, "", !Ref CuratorUserIds]
          REQUIRED_GROUP_MEMBERSHIP: !If [IsDevAuth, "", !Ref RequiredGroupMembership]
          LOG_LEVEL: !If [IsProd, INFO, DEBUG]
          SES_FROM_EMAIL: !If [EmailsEnabled, !Ref SesFromEmail, ""]
          CURATOR_EMAILS: !If [EmailsEnabled, !Ref CuratorEmails, ""]
          PORTAL_URL: !Ref PortalUrl
          CURATION_PORTAL_URL: !Ref CurationPortalUrl
          SES_REGION: !Ref AWS::Region
          OPENAI_API_KEY: !Ref OpenAIApiKey
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMS: !Ref EmbeddingDims
          EMBEDDING_SNAPSHOT_BUCKET: !Sub "mdf-embeddings-${Environment}-${AWS::AccountId}"
          EMBEDDING_SNAPSHOT_PREFIX: "embeddings/v1/"
          EMBEDDING_SNAPSHOT_PUBLIC_URL: !Ref EmbeddingSnapshotPublicUrl
      Events:
        AsyncQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AsyncJobsQueue.Arn
            # Eventual upgrade: use FifoQueue with MessageGroupId=source_id.
            BatchSize: 1
            MaximumBatchingWindowInSeconds: !Ref AsyncWorkerBatchWindowSeconds
            FunctionResponseTypes:
              - ReportBatchItemFailures
        TransferCleanupSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Description: "Periodic cleanup of stale Globus transfers and ACL rules"
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StreamsTable
        - S3CrudPolicy:
            BucketName: !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"
        - S3CrudPolicy:
            BucketName: !Sub "mdf-embeddings-${Environment}-${AWS::AccountId}"
        - SQSPollerPolicy:
            QueueName: !GetAtt AsyncJobsQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: "*"

  # ===========================================================================
  # HTTP API (v2 - cheaper than REST API v1)
  # ===========================================================================

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: MDF Connect v2 API
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref HttpApiThrottleRate
        ThrottlingBurstLimit: !Ref HttpApiThrottleBurst
      # Literals only: SAM's transform mangles intrinsics (!If) inside
      # CorsConfiguration into an invalid x-amazon-apigateway-cors body that
      # API Gateway silently ignores — the deployed API ends up with NO
      # gateway CORS at all. Gateway-level CORS matters twice over: it answers
      # preflights at the edge (they stop consuming Lambda concurrency), and
      # it puts CORS headers on gateway-generated errors (throttles/timeouts),
      # which otherwise surface in browsers as an unreadable network error
      # ("TypeError: Load failed"). Auth is Bearer-token (no cookies), so
      # wildcard origins without credentials is safe in every environment.
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-User-Id
          - X-User-Email
          - X-User-Name
          - X-Globus-Token
          - X-MDF-Token
          - X-Groups-Token
        MaxAge: 600

  # ===========================================================================
  # Custom domain (optional, additive)
  #
  # Created only when ApiCustomDomainCertArn is set; the default
  # https://{apiId}.execute-api.{region}.amazonaws.com/{stage} URL keeps working
  # either way. HTTP APIs only support REGIONAL custom domains, so the ACM
  # certificate must be issued in the same region as this stack (us-east-1).
  #
  # DNS is intentionally NOT managed here: the materialsdatafacility.org zone
  # may live outside this AWS account. After deploying, point the hostname at
  # the ApiCustomDomainRegionalDomainName / ApiCustomDomainRegionalHostedZoneId
  # outputs (Route53 alias, or a CNAME with an external DNS provider).
  # ===========================================================================

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCustomDomainCertArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  # Maps https://<custom domain>/ to the existing HttpApi stage (no base path),
  # so paths are identical to the execute-api URL minus the /{stage} prefix.
  # DependsOn targets the stage that SAM generates for HttpApi (StageName is an
  # intrinsic, so the generated logical id is "HttpApiStage") — an ApiMapping
  # create fails if the stage does not exist yet.
  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    DependsOn: HttpApiStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref Environment

  # ===========================================================================
  # S3 Bucket for Stream File Storage
  # ===========================================================================

  StreamFilesBucket:
    Type: AWS::S3::Bucket
    Condition: CreateStreamFilesBucket
    # Holds submitted data files: never delete it with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "mdf-stream-files-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Snapshot of dataset embeddings (Float32 blob + sidecar JSON).
  # Consumed by the semantic-search endpoint and, optionally, the frontend
  # for client-side cosine scan. Front the bucket with CloudFront when you
  # want browsers to read it — content-hashed keys make long cache TTLs safe.
  EmbeddingsSnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "mdf-embeddings-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # ===========================================================================
  # DynamoDB Tables
  # ===========================================================================

  AsyncJobsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "mdf-async-jobs-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AsyncJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "mdf-async-jobs-${Environment}"
      VisibilityTimeout: 180
      MessageRetentionPeriod: !Ref AsyncQueueMessageRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AsyncJobsDLQ.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  AsyncWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AsyncWorkerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "mdf-submissions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: source_id
          AttributeType: S
        - AttributeName: version
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: organization
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: legacy_source_id
          AttributeType: S
      KeySchema:
        - AttributeName: source_id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user-submissions
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: org-submissions
          KeySchema:
            - AttributeName: organization
              KeyType: HASH
            - AttributeName: source_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-submissions
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse index: only datasets migrated from v1 carry legacy_source_id,
        # so old (pre-migration) source_ids resolve to their promoted v2 record.
        - IndexName: legacy-source-id-index
          KeySchema:
            - AttributeName: legacy_source_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  StreamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "mdf-streams-${Environment}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: stream_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: stream_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-streams
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ===========================================================================
  # Observability: CloudWatch alarms -> SNS email
  #
  # Everything here is created only when AlarmEmail is set. The email
  # subscription must be confirmed once from the recipient's inbox (AWS sends a
  # confirmation link); until then the topic delivers nothing.
  #
  # All alarms use TreatMissingData: notBreaching — no traffic (and therefore no
  # metric datapoints) is not an incident.
  # ===========================================================================

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarms
    Properties:
      TopicName: !Sub "mdf-connect-v2-alarms-${Environment}"
      DisplayName: !Sub "MDF Connect v2 alarms (${Environment})"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Any unhandled API exception is user-visible — alert on two consecutive
  # 5-minute windows to ride out a single cold-start blip.
  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-api-errors"
      AlarmDescription: "ApiFunction is returning Lambda errors (5xx to clients)."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  AsyncWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-async-worker-errors"
      AlarmDescription: "AsyncWorkerFunction is failing — DOI minting / search ingest / profiling jobs are not completing."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AsyncWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # A message only reaches the DLQ after maxReceiveCount=3 failed attempts, so
  # anything in there is already news — one period, threshold 0.
  AsyncJobsDLQMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-async-dlq-not-empty"
      AlarmDescription: "Messages are sitting in the async-jobs DLQ — jobs were dropped after 3 failed attempts. Inspect and redrive."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncJobsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # Oldest message older than 15 minutes means the worker is wedged or throttled
  # (reserved concurrency is small), not merely busy.
  AsyncJobsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-async-queue-backlog"
      AlarmDescription: "Oldest async job has been queued for more than 15 minutes — worker is stalled or throttled."
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncJobsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # DynamoDB throttling. Tables are PAY_PER_REQUEST, so throttles mean a hot
  # partition or a burst beyond the table's adaptive capacity — reads and writes
  # are separate metrics (ReadThrottleEvents / WriteThrottleEvents); the
  # table-level names include GSI throttles.
  SubmissionsTableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-submissions-read-throttles"
      AlarmDescription: "Read throttling on the submissions table (or its GSIs)."
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref SubmissionsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  SubmissionsTableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-submissions-write-throttles"
      AlarmDescription: "Write throttling on the submissions table (or its GSIs)."
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref SubmissionsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  StreamsTableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-streams-read-throttles"
      AlarmDescription: "Read throttling on the streams table (or its GSI)."
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref StreamsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  StreamsTableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-streams-write-throttles"
      AlarmDescription: "Write throttling on the streams table (or its GSI)."
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref StreamsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # DynamoDB server-side faults (HTTP 500s from the service). Table-level
  # SystemErrors has no Operation dimension requirement, so a single alarm per
  # table covers every operation.
  SubmissionsTableSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-submissions-system-errors"
      AlarmDescription: "DynamoDB returned server-side errors for the submissions table."
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref SubmissionsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  StreamsTableSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "mdf-connect-v2-${Environment}-streams-system-errors"
      AlarmDescription: "DynamoDB returned server-side errors for the streams table."
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref StreamsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

# ===========================================================================
# Outputs
# ===========================================================================

Outputs:
  ApiUrl:
    Description: HTTP API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  SubmissionsTableName:
    Description: DynamoDB table for submissions
    Value: !Ref SubmissionsTable

  StreamsTableName:
    Description: DynamoDB table for streams
    Value: !Ref StreamsTable

  AsyncJobsQueueUrl:
    Description: SQS queue URL for async jobs
    Value: !Ref AsyncJobsQueue

  ApiCustomDomainUrl:
    Condition: HasCustomDomain
    Description: Public HTTPS URL once DNS points at the regional domain below
    Value: !Sub "https://${ApiCustomDomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiCustomDomainUrl"

  ApiCustomDomainRegionalDomainName:
    Condition: HasCustomDomain
    Description: "DNS target for the custom domain: create a CNAME (external DNS) or an A/ALIAS record (Route53) from ApiCustomDomainName to this value."
    Value: !GetAtt ApiDomainName.RegionalDomainName

  ApiCustomDomainRegionalHostedZoneId:
    Condition: HasCustomDomain
    Description: "Hosted zone id of the regional domain, needed only for a Route53 alias record (AliasTarget.HostedZoneId)."
    Value: !GetAtt ApiDomainName.RegionalHostedZoneId

  AlarmTopicArn:
    Condition: HasAlarms
    Description: SNS topic receiving CloudWatch alarm notifications
    Value: !Ref AlarmTopic
