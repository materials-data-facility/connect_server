# AWS SAM Configuration
#
# Usage:
#   sam build && sam deploy --config-env dev     # Deploy to dev
#   sam build && sam deploy --config-env prod    # Deploy to production
#
# First-time setup:
#   sam deploy --guided                          # Interactive setup

version = 0.1

[default.build.parameters]
use_container = false
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
disable_rollback = false

# ===========================================================================
# Development Environment
# ===========================================================================

[dev]
[dev.deploy.parameters]
stack_name = "mdf-connect-v2-dev"
s3_bucket = "mdf-sam-deployments-dev-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# Custom domain and alarms are off for dev (empty = resource not created).
parameter_overrides = 'Environment=dev AuthMode=dev ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=""'
confirm_changeset = false
tags = "Project=mdf-connect Environment=dev Team=MDF"

# ===========================================================================
# Staging Environment
# ===========================================================================

[staging]
[staging.deploy.parameters]
stack_name = "mdf-connect-v2-staging"
s3_bucket = "mdf-sam-deployments-staging-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# DataCite credentials are NOT stored here — deploy.sh resolves them from SSM
# (/mdf/staging/datacite-username, /mdf/staging/datacite-password) and refuses
# to deploy without them while UseMockDatacite=false.
#
# Custom domain / alarms are opt-in — empty means the resources are not created
# and only the execute-api URL exists. To turn them on for staging, request an
# ACM cert in us-east-1 (this stack's region; HTTP API custom domains are
# REGIONAL) and fill in:
#   ApiCustomDomainName="api-staging.materialsdatafacility.org"
#   ApiCustomDomainCertArn="arn:aws:acm:us-east-1:<account>:certificate/<uuid>"
#   AlarmEmail="mdf-ops@uchicago.edu"
# Then point DNS at the ApiCustomDomainRegionalDomainName stack output.
# UseMockDatacite=true until the DataCite TEST repository credentials are
# stored in SSM (/mdf/staging/datacite-username|password) — the previous
# staging deploy only ever carried the "not-configured" placeholder, so no
# real test-DOI behavior is being given up. Flip back to false once stored.
# ApiReservedConcurrency must be EXPLICIT here: changing a template default
# does nothing on stack updates (CloudFormation keeps the previous value for
# any parameter not listed in the overrides).
parameter_overrides = 'Environment=staging AuthMode=production AllowAllCurators=true ApiReservedConcurrency=50 AsyncWorkerBatchWindowSeconds=0 DataCiteApiUrl=https://api.test.datacite.org DataCitePrefix=10.23677 UseMockDatacite=true SearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc TestSearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=""'
tags = "Project=mdf-connect Environment=staging Team=MDF"

# ===========================================================================
# Production Environment
# ===========================================================================

[prod]
[prod.deploy.parameters]
stack_name = "mdf-connect-v2-prod"
s3_bucket = "mdf-sam-deployments-prod-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# Curation is gated to members of the MDF curators Globus group
# (AllowAllCurators=false + CuratorGroupIds). Add named break-glass admins via
# CuratorUserIds=<sub>,<sub> if the group-membership path needs a fallback.
# DataCite credentials are resolved from SSM by deploy.sh, never stored here.
#
# Custom domain: the CLI/docs expect prod at https://api.materialsdatafacility.org.
# Fill both values in before the domain exists (empty = no domain resources, the
# execute-api URL still works). The ACM cert must be in us-east-1 — the same
# region as this stack — because HTTP API custom domains are REGIONAL:
#   ApiCustomDomainName="api.materialsdatafacility.org"
#   ApiCustomDomainCertArn="arn:aws:acm:us-east-1:<account>:certificate/<uuid>"
# After deploying, create the DNS record from the
# ApiCustomDomainRegionalDomainName / ApiCustomDomainRegionalHostedZoneId outputs
# (see README "Custom domain"). Alarms: set AlarmEmail to a monitored inbox, e.g.
#   AlarmEmail="mdf-ops@uchicago.edu"
parameter_overrides = 'Environment=prod AuthMode=production AllowAllCurators=false CuratorGroupIds=3ce2c53e-3752-11e8-891c-0e00fd09bf20 DataCiteApiUrl=https://api.datacite.org DataCitePrefix=10.18126 UseMockDatacite=false SearchIndexUUID=fed3e94e-ddab-4f2d-97fd-8243f36dc676 TestSearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=""'
tags = "Project=mdf-connect Environment=prod Team=MDF"
