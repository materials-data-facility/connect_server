# AWS SAM Configuration
#
# Usage:
#   sam build && sam deploy --config-env dev     # Deploy to dev
#   sam build && sam deploy --config-env prod    # Deploy to production
#
# First-time setup:
#   sam deploy --guided                          # Interactive setup

version = 0.1

[default.build.parameters]
use_container = false
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
disable_rollback = false

# ===========================================================================
# Development Environment
# ===========================================================================

[dev]
[dev.deploy.parameters]
stack_name = "mdf-connect-v2-dev"
s3_bucket = "mdf-sam-deployments-dev-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# Custom domain and alarms are off for dev (empty = resource not created).
parameter_overrides = 'Environment=dev AuthMode=dev ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=""'
confirm_changeset = false
tags = "Project=mdf-connect Environment=dev Team=MDF"

# ===========================================================================
# Staging Environment
# ===========================================================================

[staging]
[staging.deploy.parameters]
stack_name = "mdf-connect-v2-staging"
s3_bucket = "mdf-sam-deployments-staging-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# DataCite credentials are NOT stored here — deploy.sh resolves them from SSM
# (/mdf/staging/datacite-username, /mdf/staging/datacite-password) and refuses
# to deploy without them while UseMockDatacite=false.
#
# Custom domain / alarms are opt-in — empty means the resources are not created
# and only the execute-api URL exists. To turn them on for staging, request an
# ACM cert in us-east-1 (this stack's region; HTTP API custom domains are
# REGIONAL) and fill in:
#   ApiCustomDomainName="api-staging.materialsdatafacility.org"
#   ApiCustomDomainCertArn="arn:aws:acm:us-east-1:<account>:certificate/<uuid>"
#   AlarmEmail="mdf-ops@uchicago.edu"
# Then point DNS at the ApiCustomDomainRegionalDomainName stack output.
#
# UseMockDatacite=false so staging exercises the REAL DataCite TEST API rather
# than handing out fake 10.99999 DOIs — otherwise nothing touches the DataCite
# path until prod does. This REQUIRES /mdf/staging/datacite-username and
# -password in SSM; deploy.sh hard-errors without them, so a premature deploy
# fails loudly instead of silently breaking DOI minting.
#
# PortalUrl/CurationPortalUrl point at the hosted staging frontend so curation
# emails and redirects lead to staging instead of production.
#
# SearchSubjectBase is pinned to the CANONICAL portal on purpose, and must not be
# changed to match PortalUrl. The subject is the Globus Search index's identity
# key ({base}/{source_id}); the 935 records already in the staging index were
# ingested with the canonical base, so deriving it from the new PortalUrl would
# orphan every one of them — duplicated on the next publish and un-deletable by
# delete_entry. Display URLs move; dataset identity does not.
#
# ApiReservedConcurrency must be EXPLICIT here: changing a template default
# does nothing on stack updates (CloudFormation keeps the previous value for
# any parameter not listed in the overrides).
#
# AllowAllCurators=false, matching prod. It was true, which made is_curator()
# return true for every authenticated caller regardless of group — so nothing
# ever exercised the group-membership path that prod relies on, and staging
# curation was open to anyone who could log in. CuratorGroupIds is stated
# explicitly rather than left to the template default for the same reason
# ApiReservedConcurrency is: an unlisted parameter keeps its previous stack
# value, so a default is not a guarantee.
#
# CuratorUserIds — break-glass for Ben Blaiszik, the primary curator in every
# environment. Needed because curator rights otherwise depend entirely on a
# Globus Groups lookup, and the server's dependent-token fallback is inoperable
# (see the Globus notes in Moment #204), so a Groups API outage would lock out
# ALL curators at once. is_curator() matches these against userinfo['sub'], the
# EFFECTIVE identity of the presented token — and Ben has two linked identities
# that produce different subs, so both are listed or the break-glass silently
# fails depending on which one was used to sign in:
#   c8741264-d274-11e5-bee7-f30dff9f1ea8  blaiszik@globusid.org  (what the CLI presents)
#   c8745ef4-d274-11e5-bee8-3b6845397ac9  blaiszik@uchicago.edu
# The comma separating them is PLAIN — do not escape it as '\,'. SAM's shorthand
# parser splits parameter_overrides on spaces, not commas, and passes a backslash
# through literally; '\,' would deploy CURATOR_USER_IDS with a stray backslash so
# the first id could never match, breaking the break-glass silently.
parameter_overrides = 'Environment=staging AuthMode=production AllowAllCurators=false CuratorGroupIds=3ce2c53e-3752-11e8-891c-0e00fd09bf20 CuratorUserIds=c8741264-d274-11e5-bee7-f30dff9f1ea8,c8745ef4-d274-11e5-bee8-3b6845397ac9 ApiReservedConcurrency=50 AsyncWorkerBatchWindowSeconds=0 DataCiteApiUrl=https://api.test.datacite.org DataCitePrefix=10.23677 UseMockDatacite=false SearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc TestSearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc PortalUrl=https://staging.materialsdatafacility.org CurationPortalUrl=https://staging.materialsdatafacility.org/curation SearchSubjectBase=https://materialsdatafacility.org/detail ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=blaiszik@uchicago.edu'
tags = "Project=mdf-connect Environment=staging Team=MDF"

# ===========================================================================
# Production Environment
# ===========================================================================

[prod]
[prod.deploy.parameters]
stack_name = "mdf-connect-v2-prod"
s3_bucket = "mdf-sam-deployments-prod-557062710055"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# Curation is gated to members of the MDF curators Globus group
# (AllowAllCurators=false + CuratorGroupIds), with Ben Blaiszik — the primary
# curator in every environment — named directly in CuratorUserIds as break-glass,
# so a Globus Groups outage cannot lock out every curator at once. Both of his
# linked identities are listed because is_curator() matches userinfo['sub'], the
# effective identity of the presented token, and the two produce different subs.
# See the staging block above for why that comma must NOT be escaped.
# DataCite credentials are resolved from SSM by deploy.sh, never stored here.
#
# Custom domain: the CLI/docs expect prod at https://api.materialsdatafacility.org.
# Fill both values in before the domain exists (empty = no domain resources, the
# execute-api URL still works). The ACM cert must be in us-east-1 — the same
# region as this stack — because HTTP API custom domains are REGIONAL:
#   ApiCustomDomainName="api.materialsdatafacility.org"
#   ApiCustomDomainCertArn="arn:aws:acm:us-east-1:<account>:certificate/<uuid>"
# After deploying, create the DNS record from the
# ApiCustomDomainRegionalDomainName / ApiCustomDomainRegionalHostedZoneId outputs
# (see README "Custom domain"). Alarms: set AlarmEmail to a monitored inbox, e.g.
#   AlarmEmail="mdf-ops@uchicago.edu"
# Production has no test index. The API rejects test submissions while this
# sentinel is configured, preventing them from targeting staging or a mock.
parameter_overrides = 'Environment=prod AuthMode=production AllowAllCurators=false CuratorGroupIds=3ce2c53e-3752-11e8-891c-0e00fd09bf20 CuratorUserIds=c8741264-d274-11e5-bee7-f30dff9f1ea8,c8745ef4-d274-11e5-bee8-3b6845397ac9 DataCiteApiUrl=https://api.datacite.org DataCitePrefix=10.18126 UseMockDatacite=false SearchIndexUUID=fed3e94e-ddab-4f2d-97fd-8243f36dc676 TestSearchIndexUUID=not-configured ApiCustomDomainName="" ApiCustomDomainCertArn="" AlarmEmail=""'
tags = "Project=mdf-connect Environment=prod Team=MDF"
