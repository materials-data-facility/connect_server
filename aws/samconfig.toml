# AWS SAM Configuration
#
# Usage:
#   sam build && sam deploy --config-env dev     # Deploy to dev
#   sam build && sam deploy --config-env prod    # Deploy to production
#
# First-time setup:
#   sam deploy --guided                          # Interactive setup

version = 0.1

[default.build.parameters]
use_container = false
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
disable_rollback = false

# ===========================================================================
# Development Environment
# ===========================================================================

[dev]
[dev.deploy.parameters]
stack_name = "mdf-connect-v2-dev"
s3_bucket = "mdf-sam-deployments-dev"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=dev AuthMode=dev"
confirm_changeset = false
tags = "Project=mdf-connect Environment=dev Team=MDF"

# ===========================================================================
# Staging Environment
# ===========================================================================

[staging]
[staging.deploy.parameters]
stack_name = "mdf-connect-v2-staging"
s3_bucket = "mdf-sam-deployments-staging"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# DataCite credentials are NOT stored here — deploy.sh resolves them from SSM
# (/mdf/staging/datacite-username, /mdf/staging/datacite-password) and refuses
# to deploy without them while UseMockDatacite=false.
parameter_overrides = "Environment=staging AuthMode=production AllowAllCurators=true DataCiteApiUrl=https://api.test.datacite.org DataCitePrefix=10.23677 UseMockDatacite=false SearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc TestSearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc"
tags = "Project=mdf-connect Environment=staging Team=MDF"

# ===========================================================================
# Production Environment
# ===========================================================================

[prod]
[prod.deploy.parameters]
stack_name = "mdf-connect-v2-prod"
s3_bucket = "mdf-sam-deployments-prod"
s3_prefix = "mdf-connect-v2"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
# Curation is gated to members of the MDF curators Globus group
# (AllowAllCurators=false + CuratorGroupIds). Add named break-glass admins via
# CuratorUserIds=<sub>,<sub> if the group-membership path needs a fallback.
# DataCite credentials are resolved from SSM by deploy.sh, never stored here.
parameter_overrides = "Environment=prod AuthMode=production AllowAllCurators=false CuratorGroupIds=3ce2c53e-3752-11e8-891c-0e00fd09bf20 DataCiteApiUrl=https://api.datacite.org DataCitePrefix=10.18126 UseMockDatacite=false SearchIndexUUID=fed3e94e-ddab-4f2d-97fd-8243f36dc676 TestSearchIndexUUID=ab19b80b-0887-4337-b9f8-b8cc7feb1fdc"
tags = "Project=mdf-connect Environment=prod Team=MDF"
